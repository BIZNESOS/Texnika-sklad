<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Каталог — TEXNIKA SKLAD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pb-20 sm:pb-0">

<header class="site-header sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-[68px] flex items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-2 shrink-0">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-display font-extrabold text-sm" style="background:linear-gradient(150deg,var(--blue-500),var(--navy-900))">TS</div>
      <div class="leading-none">
        <div class="font-display font-extrabold text-[15px] tracking-tight">TEXNIKA</div>
        <div class="font-display font-extrabold text-[15px] tracking-tight" style="color:var(--blue-500)">SKLAD</div>
      </div>
    </a>
    <nav class="hidden lg:flex items-center gap-7">
      <a href="index.html" class="nav-link">Главная</a>
      <a href="catalog.html" class="nav-link active">Каталог</a>
      <a href="catalog.html?sale=1" class="nav-link">Акции</a>
      <a href="index.html#about" class="nav-link">О нас</a>
      <a href="index.html#contacts" class="nav-link">Контакты</a>
    </nav>
    <div class="hidden md:flex items-center flex-1 max-w-xs mx-2">
      <button onclick="openSearch()" class="w-full flex items-center gap-2 text-sm text-[var(--ink-400)] bg-[var(--bg-light)] rounded-full px-4 py-2.5"><i data-lucide="search" class="w-4 h-4"></i>Поиск товаров…</button>
    </div>
    <div class="flex items-center gap-0.5">
      <button class="icon-btn md:hidden" onclick="openSearch()"><i data-lucide="search" class="w-[18px] h-[18px]"></i></button>
      <a href="favorites.html" class="icon-btn hidden sm:flex"><i data-lucide="heart" class="w-[18px] h-[18px]"></i><span class="badge-count fav-count hidden">0</span></a>
      <button class="icon-btn" onclick="openCart()"><i data-lucide="shopping-cart" class="w-[18px] h-[18px]"></i><span class="badge-count cart-count hidden">0</span></button>
      <button class="icon-btn hidden sm:flex" onclick="openAI()"><i data-lucide="sparkles" class="w-[18px] h-[18px]"></i></button>
      <a href="admin.html" class="icon-btn hidden sm:flex"><i data-lucide="user" class="w-[18px] h-[18px]"></i></a>
    </div>
  </div>
</header>

<div id="searchOverlay" class="hidden fixed inset-0 z-[95] overlay-scrim">
  <div class="max-w-xl mx-auto mt-16 sm:mt-24 px-4">
    <div class="bg-white rounded-2xl shadow-2xl p-4">
      <div class="flex items-center gap-2 border-b border-[var(--line)] pb-3 mb-3">
        <i data-lucide="search" class="w-5 h-5 text-[var(--ink-400)]"></i>
        <input id="searchInput" oninput="runSearch(this.value)" type="text" placeholder="Поиск товаров…" class="flex-1 outline-none text-sm">
        <button onclick="closeSearch()" class="icon-btn"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="searchResults" class="max-h-[60vh] overflow-y-auto hide-scrollbar"></div>
    </div>
  </div>
</div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-center gap-1.5 text-xs text-[var(--ink-400)] mb-4">
    <a href="index.html" class="hover:text-[var(--blue-500)]">Главная</a><span>/</span><span class="text-[var(--ink-900)] font-medium" id="crumbLabel">Все товары</span>
  </div>

  <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <h1 class="font-display font-extrabold text-2xl" id="pageTitle">Все товары</h1>
    <div class="flex items-center gap-2">
      <button class="btn-outline px-3.5 py-2 text-sm flex items-center gap-2 lg:hidden" onclick="toggleFilters()"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i>Фильтры</button>
      <select id="sortSelect" onchange="applyFilters()" class="btn-outline px-3 py-2 text-sm outline-none">
        <option value="popular">Популярные</option>
        <option value="new">Новинки</option>
        <option value="price_asc">Цена ↑</option>
        <option value="price_desc">Цена ↓</option>
        <option value="discount">Скидка</option>
      </select>
    </div>
  </div>

  <div class="grid lg:grid-cols-[240px_1fr] gap-8">
    <!-- FILTERS -->
    <aside id="filtersPanel" class="hidden lg:block space-y-6">
      <div>
        <div class="font-semibold text-sm mb-3">Категории</div>
        <div class="space-y-1.5 text-sm" id="filterCategories"></div>
      </div>
      <div>
        <div class="font-semibold text-sm mb-3">Бренд</div>
        <div class="space-y-1.5 text-sm" id="filterBrands"></div>
      </div>
      <div>
        <div class="font-semibold text-sm mb-3">Цена, сомони</div>
        <div class="flex items-center gap-2">
          <input id="priceMin" type="number" placeholder="от" class="w-full border border-[var(--line)] rounded-lg px-2.5 py-2 text-sm outline-none focus:border-[var(--blue-500)]">
          <input id="priceMax" type="number" placeholder="до" class="w-full border border-[var(--line)] rounded-lg px-2.5 py-2 text-sm outline-none focus:border-[var(--blue-500)]">
        </div>
        <button class="text-xs font-semibold mt-2" style="color:var(--blue-500)" onclick="applyFilters()">Применить</button>
      </div>
      <div>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="filterSale" onchange="applyFilters()">Только со скидкой</label>
      </div>
      <button class="text-xs font-semibold text-[var(--ink-400)] hover:text-[var(--blue-500)]" onclick="resetFilters()">Сбросить фильтры</button>
    </aside>

    <div>
      <div class="text-sm text-[var(--ink-400)] mb-3" id="resultsCount"></div>
      <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </div>
  </div>
</main>

<nav class="mobile-nav fixed bottom-0 inset-x-0 z-40 sm:hidden flex items-stretch h-16" style="padding-bottom:env(safe-area-inset-bottom,0)">
  <a href="index.html" class="mobile-nav-item flex-1 flex flex-col items-center justify-center gap-1 text-[10px] font-medium"><i data-lucide="home" class="w-5 h-5"></i>Главная</a>
  <a href="catalog.html" class="mobile-nav-item active flex-1 flex flex-col items-center justify-center gap-1 text-[10px] font-medium"><i data-lucide="layout-grid" class="w-5 h-5"></i>Каталог</a>
  <button onclick="openSearch()" class="mobile-nav-item flex-1 flex flex-col items-center justify-center gap-1 text-[10px] font-medium"><i data-lucide="search" class="w-5 h-5"></i>Поиск</button>
  <button onclick="openCart()" class="mobile-nav-item flex-1 flex flex-col items-center justify-center gap-1 text-[10px] font-medium relative"><i data-lucide="shopping-cart" class="w-5 h-5"></i>Корзина<span class="badge-count cart-count hidden" style="top:2px;right:22%">0</span></button>
  <button onclick="openAI()" class="mobile-nav-item flex-1 flex flex-col items-center justify-center gap-1 text-[10px] font-medium"><i data-lucide="sparkles" class="w-5 h-5"></i>AI</button>
</nav>

<div id="compareBar" class="hidden fixed bottom-20 sm:bottom-6 left-1/2 -translate-x-1/2 z-40 bg-[var(--navy-900)] text-white rounded-full pl-5 pr-2 py-2 flex items-center gap-3 shadow-2xl">
  <span class="text-sm font-medium"><span id="compareCount">0</span> товара к сравнению</span>
  <button onclick="openCompare()" class="bg-[var(--blue-500)] text-xs font-semibold px-3.5 py-2 rounded-full">Сравнить</button>
</div>

<div id="cartDrawer" class="hidden fixed inset-0 z-[80]">
  <div class="overlay-scrim absolute inset-0" onclick="closeCart()"></div>
  <div class="drawer absolute right-0 top-0 h-full w-full sm:w-[420px] flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-[var(--line)]">
      <h3 class="font-display font-bold">Корзина</h3>
      <button class="icon-btn" onclick="closeCart()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto px-5"></div>
    <div class="px-5 py-4 border-t border-[var(--line)]">
      <div class="flex items-center justify-between mb-3.5"><span class="text-sm text-[var(--ink-400)]">Итого</span><span id="cartTotal" class="text-xl font-bold">0 с.</span></div>
      <button class="btn-primary w-full py-3.5 text-sm" onclick="openCheckout()">Оформить заказ</button>
    </div>
  </div>
</div>

<div id="checkoutModal" class="hidden fixed inset-0 z-[85] overlay-scrim flex items-end sm:items-center justify-center" onclick="if(event.target===this) closeCheckout()">
  <form onsubmit="submitOrder(event)" class="modal-card w-full sm:max-w-md max-h-[92vh] overflow-y-auto hide-scrollbar rounded-t-3xl sm:rounded-3xl p-6">
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-display font-bold text-lg">Оформление заказа</h3>
      <button type="button" class="icon-btn" onclick="closeCheckout()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="space-y-3.5">
      <input name="name" required placeholder="Имя" class="w-full border border-[var(--line)] rounded-xl px-4 py-3 text-sm outline-none focus:border-[var(--blue-500)]">
      <input name="phone" required placeholder="Телефон" class="w-full border border-[var(--line)] rounded-xl px-4 py-3 text-sm outline-none focus:border-[var(--blue-500)]">
      <input name="city" required placeholder="Город" value="Душанбе" class="w-full border border-[var(--line)] rounded-xl px-4 py-3 text-sm outline-none focus:border-[var(--blue-500)]">
      <input name="address" placeholder="Адрес" class="w-full border border-[var(--line)] rounded-xl px-4 py-3 text-sm outline-none focus:border-[var(--blue-500)]">
      <textarea name="comment" placeholder="Комментарий к заказу" rows="2" class="w-full border border-[var(--line)] rounded-xl px-4 py-3 text-sm outline-none focus:border-[var(--blue-500)] resize-none"></textarea>
      <div>
        <div class="text-xs font-semibold text-[var(--ink-400)] mb-2 uppercase tracking-wide">Способ получения</div>
        <div class="flex gap-3 text-sm">
          <label class="flex items-center gap-2"><input type="radio" name="delivery" value="delivery" checked>Доставка</label>
          <label class="flex items-center gap-2"><input type="radio" name="delivery" value="pickup">Самовывоз</label>
        </div>
      </div>
      <div>
        <div class="text-xs font-semibold text-[var(--ink-400)] mb-2 uppercase tracking-wide">Способ оплаты</div>
        <div class="flex flex-wrap gap-3 text-sm">
          <label class="flex items-center gap-2"><input type="radio" name="payment" value="cash" checked>Наличными</label>
          <label class="flex items-center gap-2"><input type="radio" name="payment" value="transfer">Перевод</label>
          <label class="flex items-center gap-2"><input type="radio" name="payment" value="other">Другое</label>
        </div>
      </div>
    </div>
    <button type="submit" class="btn-primary w-full py-3.5 text-sm mt-5">Подтвердить заказ</button>
  </form>
</div>

<div id="productModal" class="hidden"></div>
<div id="compareModal" class="hidden"></div>
<div id="successModal" class="hidden"></div>

<button onclick="openAI()" class="ai-fab fixed bottom-24 sm:bottom-7 right-5 sm:right-7 z-40 w-14 h-14 rounded-full flex items-center justify-center text-white"><i data-lucide="sparkles" class="w-6 h-6"></i></button>

<div id="aiPanel" class="hidden fixed inset-0 z-[90]">
  <div class="overlay-scrim absolute inset-0" onclick="closeAI()"></div>
  <div class="ai-panel absolute right-0 top-0 h-full w-full sm:w-[400px] flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
      <div class="flex items-center gap-2.5">
        <div class="ai-fab w-9 h-9 rounded-full flex items-center justify-center"><i data-lucide="sparkles" class="w-4 h-4 text-white"></i></div>
        <div><div class="text-white font-display font-bold text-sm leading-tight">TEXNIKA AI</div><div class="text-[#8ea3cc] text-xs">Ваш персональный консультант по технике</div></div>
      </div>
      <button class="icon-btn" style="color:#fff" onclick="closeAI()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="aiMessages" class="flex-1 overflow-y-auto hide-scrollbar px-5 py-4 space-y-3"></div>
    <div class="px-5 pb-2 flex gap-2 overflow-x-auto hide-scrollbar">
      <button class="ai-chip whitespace-nowrap text-xs px-3 py-1.5 rounded-full" onclick="sendAIMessage('Нужен холодильник до 5000 сомони')">Холодильник до 5000</button>
      <button class="ai-chip whitespace-nowrap text-xs px-3 py-1.5 rounded-full" onclick="sendAIMessage('Какой телевизор подойдёт для PS5?')">ТВ для PS5</button>
      <button class="ai-chip whitespace-nowrap text-xs px-3 py-1.5 rounded-full" onclick="sendAIMessage('Есть ли доставка?')">Доставка</button>
    </div>
    <div class="px-4 pb-4 pt-2 border-t border-white/10">
      <div class="flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-3 py-1.5">
        <input id="aiInput" onkeydown="if(event.key==='Enter'){sendAIMessage()}" type="text" placeholder="Напишите ваш вопрос…" class="flex-1 bg-transparent outline-none text-sm text-white placeholder:text-[#8ea3cc] px-1 py-2">
        <button onclick="sendAIMessage()" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:var(--blue-500)"><i data-lucide="send" class="w-4 h-4 text-white"></i></button>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let filters = {
    cat: params.get('cat') || null,
    brand: null,
    sale: params.get('sale') === '1',
    min: null, max: null,
  };

  function renderFilterCategories() {
    $('#filterCategories').innerHTML = `<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="fcat" ${!filters.cat?'checked':''} onchange="filters.cat=null; applyFilters()">Все категории</label>` +
      CATEGORIES.map(c => `<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="fcat" ${filters.cat===c.id?'checked':''} onchange="filters.cat='${c.id}'; applyFilters()">${c.name}</label>`).join('');
  }
  function renderFilterBrands() {
    $('#filterBrands').innerHTML = `<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="fbrand" ${!filters.brand?'checked':''} onchange="filters.brand=null; applyFilters()">Все бренды</label>` +
      BRANDS.map(b => `<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="fbrand" ${filters.brand===b?'checked':''} onchange="filters.brand='${b}'; applyFilters()">${b}</label>`).join('');
  }

  function applyFilters() {
    let list = [...PRODUCTS];
    if (filters.cat) list = list.filter(p => p.cat === filters.cat);
    if (filters.brand) list = list.filter(p => p.brand === filters.brand);
    if (filters.sale || $('#filterSale')?.checked) list = list.filter(p => p.badges.includes('sale'));
    const min = parseInt($('#priceMin')?.value) || null;
    const max = parseInt($('#priceMax')?.value) || null;
    if (min) list = list.filter(p => p.price >= min);
    if (max) list = list.filter(p => p.price <= max);

    const sort = $('#sortSelect').value;
    if (sort === 'price_asc') list.sort((a,b) => a.price - b.price);
    else if (sort === 'price_desc') list.sort((a,b) => b.price - a.price);
    else if (sort === 'discount') list.sort((a,b) => b.discount - a.discount);
    else if (sort === 'new') list = list.filter(p => p.badges.includes('new')).concat(list.filter(p => !p.badges.includes('new')));
    else list.sort((a,b) => b.reviews - a.reviews);

    $('#pageTitle').textContent = filters.cat ? getCategoryName(filters.cat) : (filters.sale ? 'Акции' : 'Все товары');
    $('#crumbLabel').textContent = $('#pageTitle').textContent;
    $('#resultsCount').textContent = `Найдено товаров: ${list.length}`;
    renderProductGrid('#catalogGrid', list);
    renderFilterCategories(); renderFilterBrands();
  }
  function resetFilters() {
    filters = { cat: null, brand: null, sale: false, min: null, max: null };
    $('#priceMin').value = ''; $('#priceMax').value = ''; $('#filterSale').checked = false;
    applyFilters();
  }
  function toggleFilters() { $('#filtersPanel').classList.toggle('hidden'); }

  renderFilterCategories(); renderFilterBrands(); applyFilters();
</script>
</body>
</html>
